<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roblox Retro 2006</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #80A2FD;
      font-family: "Courier New", Courier, monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top Bar Estilo Roblox 2006 */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: linear-gradient(180deg, #4a4a4a 0%, #1f1f1f 100%);
      border-bottom: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #fff;
      font-weight: bold;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .logo {
      color: #e60000;
      text-shadow: 1px 1px 0 #fff, -1px -1px 0 #000;
      font-size: 20px;
      letter-spacing: 1px;
    }
    .stats {
      font-size: 14px;
      color: #ffea00;
    }

    /* Controles Mobile (Joysticks / Botões) */
    .mobile-ui {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    /* Touch Zone Esquerda (Andar) */
    #joystick-zone {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      background: rgba(230, 0, 0, 0.8);
      border: 2px solid #fff;
      border-radius: 50%;
    }

    /* Botão de Pulo (Direita) */
    #jump-btn {
      position: absolute;
      bottom: 30px;
      right: 25px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffea00 0%, #d4a000 100%);
      border: 3px solid #000;
      border-radius: 50%;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      box-shadow: 0 4px 0 #886800;
      active {
        box-shadow: none;
        transform: translateY(4px);
      }
    }

    /* Dicas para Computador */
    #pc-instructions {
      position: absolute;
      top: 50px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      /* Oculta os botões touch em telas maiores se preferir ou mantém como opção */
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="logo">ROBLOX</div>
    <div class="stats">Moedas: <span id="score">0</span></div>
  </div>

  <div id="pc-instructions">
    <b>PC Controles:</b><br>
    W, A, S, D - Mover<br>
    Espaço - Pular
  </div>

  <div class="mobile-ui">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn">PULAR</div>
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- CONFIGURAÇÃO DA CENA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x80A2FD); // Céu azul roblox antigo
    scene.fog = new THREE.FogExp2(0x80A2FD, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap;
    container.appendChild(renderer.domElement);

    // --- ILUMINAÇÃO RETRÔ ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(40, 60, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // --- BASEPLATE (O chão clássico de pinos) ---
    const baseplateGeo = new THREE.BoxGeometry(100, 2, 100);
    const baseplateMat = new THREE.MeshLambertMaterial({ color: 0x008000 }); // Verde clássico
    const baseplate = new THREE.Mesh(baseplateGeo, baseplateMat);
    baseplate.position.y = -1;
    baseplate.receiveShadow = true;
    scene.add(baseplate);

    // --- CRIAÇÃO DO PERSONAGEM (NOOB RETRÔ) ---
    const playerGroup = new THREE.Group();

    // Material Plástico Brilhante Retrô
    const matHeadMat = new THREE.MeshLambertMaterial({ color: 0xF5CD2F }); // Amarelo
    const torsoMat = new THREE.MeshLambertMaterial({ color: 0x0D69AC });   // Azul
    const limbsMat = new THREE.MeshLambertMaterial({ color: 0xA0A5A9 });   // Cinza / Verde

    // Cabeça
    const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), matHeadMat);
    head.position.y = 2.2;
    head.castShadow = true;
    playerGroup.add(head);

    // Tronco
    const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
    torso.position.y = 1;
    torso.castShadow = true;
    playerGroup.add(torso);

    // Braço Esquerdo
    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), matHeadMat);
    leftArm.position.set(-1.4, 1, 0);
    leftArm.castShadow = true;
    playerGroup.add(leftArm);

    // Braço Direito
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), matHeadMat);
    rightArm.position.set(1.4, 1, 0);
    rightArm.castShadow = true;
    playerGroup.add(rightArm);

    // Perna Esquerda
    const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), limbsMat);
    leftLeg.position.set(-0.55, -1, 0);
    leftLeg.castShadow = true;
    playerGroup.add(leftLeg);

    // Perna Direita
    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), limbsMat);
    rightLeg.position.set(0.55, -1, 0);
    rightLeg.castShadow = true;
    playerGroup.add(rightLeg);

    playerGroup.position.set(0, 2, 0);
    scene.add(playerGroup);

    // --- OBJETOS DO CENÁRIO (BLOCOS COLORIDOS & MOEDAS) ---
    const blockColors = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0xFF00FF];
    const coins = [];

    // Gerar Obstáculos/Torres Retrô
    for(let i = 0; i < 15; i++) {
      const h = Math.floor(Math.random() * 4) + 2;
      const geo = new THREE.BoxGeometry(3, h, 3);
      const mat = new THREE.MeshLambertMaterial({ 
        color: blockColors[Math.floor(Math.random() * blockColors.length)] 
      });
      const block = new THREE.Mesh(geo, mat);
      block.position.set(
        (Math.random() - 0.5) * 60,
        h / 2,
        (Math.random() - 0.5) * 60
      );
      block.castShadow = true;
      block.receiveShadow = true;
      scene.add(block);

      // Colocar Moeda Amarela em cima de alguns blocos
      if(Math.random() > 0.4) {
        const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 12);
        const coinMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(block.position.x, h + 1, block.position.z);
        scene.add(coin);
        coins.push(coin);
      }
    }

    // --- FÍSICA E MOVIMENTAÇÃO ---
    let velocityY = 0;
    const gravity = -0.015;
    let isGrounded = false;
    let moveVector = { x: 0, z: 0 };
    let score = 0;

    // --- CONTROLES (TECLADO) ---
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- CONTROLES (TOUCH / JOYSTICK) ---
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    const jumpBtn = document.getElementById('jump-btn');

    let touchId = null;
    let joystickCenter = { x: 0, y: 0 };

    joystickZone.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      touchId = touch.identifier;
      const rect = joystickZone.getBoundingClientRect();
      joystickCenter = {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
      updateJoystick(touch);
    });

    joystickZone.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
          updateJoystick(e.changedTouches[i]);
        }
      }
    });

    const resetJoystick = () => {
      touchId = null;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      moveVector.x = 0;
      moveVector.z = 0;
    };

    joystickZone.addEventListener('touchend', resetJoystick);
    joystickZone.addEventListener('touchcancel', resetJoystick);

    function updateJoystick(touch) {
      const maxDist = 35;
      let dx = touch.clientX - joystickCenter.x;
      let dy = touch.clientY - joystickCenter.y;
      const dist = Math.hypot(dx, dy);

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveVector.x = dx / maxDist;
      moveVector.z = dy / maxDist;
    }

    // Pulo Touch
    jumpBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerJump();
    });

    function triggerJump() {
      if (isGrounded) {
        velocityY = 0.45;
        isGrounded = false;
      }
    }

    // --- LOOP DE ANIMAÇÃO / ATUALIZAÇÃO ---
    let walkCycle = 0;

    function animate() {
      requestAnimationFrame(animate);

      // --- Processar Entrada Teclado ---
      let inputX = moveVector.x;
      let inputZ = moveVector.z;

      if (keys['KeyA'] || keys['ArrowLeft']) inputX = -1;
      if (keys['KeyD'] || keys['ArrowRight']) inputX = 1;
      if (keys['KeyW'] || keys['ArrowUp']) inputZ = -1;
      if (keys['KeyS'] || keys['ArrowDown']) inputZ = 1;
      if (keys['Space']) triggerJump();

      // --- Mover Jogador ---
      const speed = 0.25;
      if (Math.abs(inputX) > 0.1 || Math.abs(inputZ) > 0.1) {
        playerGroup.position.x += inputX * speed;
        playerGroup.position.z += inputZ * speed;

        // Rotacionar personagem na direção do movimento
        const angle = Math.atan2(inputX, inputZ);
        playerGroup.rotation.y = angle;

        // Animação retrô de caminhada (pernas/braços balançando)
        walkCycle += 0.2;
        leftArm.rotation.x = Math.sin(walkCycle) * 0.7;
        rightArm.rotation.x = -Math.sin(walkCycle) * 0.7;
        leftLeg.rotation.x = -Math.sin(walkCycle) * 0.7;
        rightLeg.rotation.x = Math.sin(walkCycle) * 0.7;
      } else {
        // Reset da postura parado
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;
      }

      // --- Gravidade e Chão ---
      velocityY += gravity;
      playerGroup.position.y += velocityY;

      if (playerGroup.position.y <= 2) { // 2 = Altura do chão considerando origem do modelo
        playerGroup.position.y = 2;
        velocityY = 0;
        isGrounded = true;
      }

      // --- Câmera Clássica (Visão 3ª Pessoa Fixa Seguindo) ---
      camera.position.x = playerGroup.position.x;
      camera.position.y = playerGroup.position.y + 12;
      camera.position.z = playerGroup.position.z + 20;
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

      // --- Coleta de Moedas ---
      coins.forEach((coin, index) => {
        coin.rotation.z += 0.05; // Gira a moeda
        const dist = playerGroup.position.distanceTo(coin.position);
        if (dist < 2) {
          scene.remove(coin);
          coins.splice(index, 1);
          score += 10;
          document.getElementById('score').innerText = score;
        }
      });

      renderer.render(scene, camera);
    }

    // --- AJUSTE RESPONSIVO DE TELA ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
